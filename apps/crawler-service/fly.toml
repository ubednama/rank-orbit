# Fly.io app config for the rank-orbit crawler-service.
#
# Heads up: Chromium needs RAM. 1GB is the floor for reliable Lighthouse runs
# on real-world pages. 512MB will OOM on heavy sites.
#
# Once we migrate to Browserless.io (per ADR 005), this service shrinks back
# to a thin Fastify HTTP wrapper and can drop to shared-cpu-1x@512mb.
#
# Deploy:
#   - From dashboard: build context = repo root, Dockerfile = apps/crawler-service/Dockerfile
#   - From CLI: `fly deploy --dockerfile apps/crawler-service/Dockerfile` from repo root

app = "rank-orbit-crawler"
primary_region = "fra"

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
LOG_LEVEL = "info"
CRAWLER_PORT = "3001"
PUPPETEER_HEADLESS = "true"

[http_service]
internal_port = 3001
force_https = true
auto_stop_machines = "stop"     # scale-to-zero
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[http_service.checks]]
grace_period = "20s"            # crawler boots are slower (Chromium spin-up)
interval = "30s"
method = "GET"
timeout = "5s"
path = "/api/health"

[[vm]]
size = "shared-cpu-1x"
memory = "1024mb"               # Chromium needs the headroom
