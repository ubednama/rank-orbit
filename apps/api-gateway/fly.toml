# Fly.io app config for the rank-orbit api-gateway.
#
# To deploy from the dashboard:
#   1. Create a Fly app named "rank-orbit-api-gateway" (or change app= below to match)
#   2. Set the build context to the repo root (Dockerfile path: apps/api-gateway/Dockerfile)
#   3. Add secrets in the dashboard (Settings → Secrets):
#        DATABASE_URL, JWT_SECRET, REDIS_URL, RESEND_API_KEY (optional),
#        SENDGRID_API_KEY (optional), EMAIL_FROM, APP_URL
#      AI_SERVICE_URL + CRAWLER_SERVICE_URL go in [env] below (public URLs).
#
# To deploy from the CLI: `fly deploy --dockerfile apps/api-gateway/Dockerfile`
# (run from repo root so the build context is correct).

app = "rank-orbit-api-gateway"
primary_region = "fra"  # change to whichever Supabase region you picked

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
LOG_LEVEL = "info"
API_GATEWAY_PORT = "3333"
# Public URLs of the other services — update these once they're deployed
CRAWLER_SERVICE_URL = "https://rank-orbit-crawler.fly.dev"
AI_SERVICE_URL = "https://<your-hf-username>-rank-orbit-ai.hf.space/api"

[http_service]
internal_port = 3333
force_https = true
auto_stop_machines = "stop"     # scale-to-zero when idle (free-tier friendly)
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/api/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
