# fly.toml app configuration file generated for rank-orbit on 2026-04-30T13:07:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rank-orbit'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[env]
  AI_SERVICE_URL = 'https://<your-hf-username>-rank-orbit-ai.hf.space/api'
  API_GATEWAY_PORT = '3333'
  CRAWLER_SERVICE_URL = 'https://rank-orbit-crawler.fly.dev'
  LOG_LEVEL = 'info'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
